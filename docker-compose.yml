version: '3.8'

services:
  # 1. Database Service (Supabase Postgres)
  db:
    image: supabase/postgres:15.1.1.78
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend Service (NestJS)
  backend:
    build: ./apps/server
    ports:
      - "8000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/postgres
      # 未配置真实 Supabase 时后端自动使用内存仓储（含演示种子数据）
      SUPABASE_URL: ${SUPABASE_URL:-http://placeholder-project.supabase.co}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      # 单次外呼振铃超时秒数，超时自动转接下一位联系人
      CALL_RING_TIMEOUT_SEC: ${CALL_RING_TIMEOUT_SEC:-8}

  # 3. Frontend Service (React + Vite + Nginx)
  frontend:
    build: ./apps/client
    ports:
      - "3000:80"
    depends_on:
      - backend
